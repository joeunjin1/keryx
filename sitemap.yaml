# ─────────────────────────────────────────────
# API 라우트 (서버 전용)
# ─────────────────────────────────────────────
api:
  public:
    - path: /api/public/products
    - path: /api/public/products/[id]
    - path: /api/public/factories
    - path: /api/public/categories
    - path: /api/exchange-rates

  auth:
    - path: /api/auth/me
    - path: /api/auth/signout
    - path: /api/auth/callback

  admin:
    - path: /api/admin/error-report
    - path: /api/admin/factories/approve
    - path: /api/admin/register-factory
    - path: /api/admin/register-seller
    - path: /api/admin/subscriptions

  ai:
    - path: /api/ai/brief-draft
    - path: /api/ai/match-products
    - path: /api/ai/match-products/[matchId]
    - path: /api/ai/match-products/[matchId]/promote

  cron:
    - path: /api/cron/daily-alerts
    - path: /api/cron/exchange-rates

# ─────────────────────────────────────────────
# DB 테이블 목록 (Supabase)
# ─────────────────────────────────────────────
database:
  tables:
    - name: profiles
      description: 사용자 프로필 (role, tier 포함)
      sensitive_columns: [cost, margin]
      rls: true

    - name: factories
      description: 공장 정보
      rls: true

    - name: products
      description: 상품 데이터
      sensitive_columns: [cost_price, margin_rate]
      rls: true

    - name: categories
      description: 상품 카테고리
      rls: false

    - name: orders
      description: 주문 데이터
      sensitive_columns: [cost_total, margin_total]
      rls: true

    - name: order_items
      description: 주문 항목
      rls: true

    - name: briefs
      description: 의뢰서
      rls: true

    - name: brief_proposals
      description: 의뢰 제안
      rls: true

    - name: inspections
      description: 검수 데이터
      rls: true

    - name: inspection_photos
      description: 검수 사진
      rls: true

    - name: subscriptions
      description: 구독 정보
      rls: true

    - name: subscription_plans
      description: 구독 플랜
      rls: false

    - name: payments
      description: 결제 내역
      rls: true

    - name: conversations
      description: 채팅 대화방
      rls: true

    - name: messages
      description: 채팅 메시지
      rls: true

    - name: notifications
      description: 알림
      rls: true

    - name: ip_characters
      description: IP 캐릭터
      rls: true

    - name: ip_licenses
      description: IP 라이센스
      rls: true

    - name: ip_license_requests
      description: IP 라이센스 요청
      rls: true

    - name: research_requests
      description: 시장조사 요청
      rls: true

    - name: sample_requests
      description: 샘플 요청
      rls: true

    - name: price_change_requests
      description: 가격 수정 요청
      rls: true

    - name: design_tasks
      description: 디자인 작업
      rls: true

    - name: factory_ratings
      description: 공장 평가
      rls: true

    - name: product_interests
      description: 관심 상품
      rls: true
