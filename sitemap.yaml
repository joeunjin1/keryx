# KERYX Platform Sitemap — Single Source of Truth
# living-sitemap-system 스킬 원칙 준수
# 모든 라우트, 권한, DB 테이블, i18n 키를 이 파일에서 관리
# 변경 시 반드시 이 파일을 먼저 수정 후 코드에 반영

version: "2.0"
updated: "2026-05-04"

# ─────────────────────────────────────────────
# 공개 라우트 (인증 불필요)
# ─────────────────────────────────────────────
public:
  - path: /
    label: 홈
    labelZh: 首页
    component: src/app/page.tsx

  - path: /shop
    label: B2B 쇼핑몰
    labelZh: B2B商城
    component: src/app/shop/page.tsx
    db_tables: [products, factories, categories]

  - path: /shop/factory/[factoryId]
    label: 공장 상세
    labelZh: 工厂详情
    component: src/app/shop/factory/[factoryId]/page.tsx
    db_tables: [factories, products]

  - path: /products/[id]
    label: 상품 상세
    labelZh: 商品详情
    component: src/app/products/[id]/page.tsx
    db_tables: [products]

  - path: /login
    label: 로그인
    labelZh: 登录
    component: src/app/login/page.tsx

  - path: /signup
    label: 회원가입
    labelZh: 注册
    component: src/app/signup/page.tsx

  - path: /register
    label: 공장 등록
    labelZh: 工厂注册
    component: src/app/register/page.tsx

  - path: /membership
    label: 멤버십
    labelZh: 会员计划
    component: src/app/membership/page.tsx
    db_tables: [subscription_plans]

  - path: /support
    label: 고객센터
    labelZh: 客户支持
    component: src/app/support/page.tsx

  - path: /faq
    label: FAQ
    labelZh: 常见问题
    component: src/app/faq/page.tsx

  - path: /privacy
    label: 개인정보처리방침
    labelZh: 隐私政策
    component: src/app/privacy/page.tsx

  - path: /terms
    label: 이용약관
    labelZh: 使用条款
    component: src/app/terms/page.tsx

# ─────────────────────────────────────────────
# Admin 포털 (role: admin)
# ─────────────────────────────────────────────
admin:
  role: admin
  bypass_roles: [admin]  # admin은 모든 포털 접근 가능
  base_path: /admin
  shell: AdminShell
  nav_source: src/config/navigation.ts#adminNavItems
  pages:
    - path: /admin
      label: 대시보드
      labelZh: 管理控制台
      db_tables: [profiles, orders, products, factories]

    - path: /admin/sellers
      label: 셀러 목록·관리
      labelZh: 卖家列表·管理
      db_tables: [profiles, subscriptions]

    - path: /admin/factories
      label: 공장 목록·상세
      labelZh: 工厂列表·详情
      db_tables: [factories, profiles]

    - path: /admin/factories/approvals
      label: 공장 입점 승인
      labelZh: 工厂入驻审批
      db_tables: [factories]

    - path: /admin/factory-ratings
      label: 공장 평가·점수
      labelZh: 工厂评分
      db_tables: [factory_ratings]

    - path: /admin/inspections
      label: 검수 관리
      labelZh: 验货管理
      db_tables: [inspections]

    - path: /admin/inspections/[inspectionId]
      label: 검수 상세
      labelZh: 验货详情
      db_tables: [inspections, inspection_photos]

    - path: /admin/products
      label: 전체 상품 데이터
      labelZh: 全部商品数据
      db_tables: [products, categories]

    - path: /admin/products/price-approvals
      label: 가격 수정 승인
      labelZh: 价格修改审批
      db_tables: [price_change_requests, products]

    - path: /admin/ip-studio
      label: IP Studio
      labelZh: IP Studio
      db_tables: [ip_characters]

    - path: /admin/ip-studio/[characterId]
      label: IP 캐릭터 상세
      labelZh: IP角色详情
      db_tables: [ip_characters, ip_assets]

    - path: /admin/ip-studio/new
      label: IP 캐릭터 등록
      labelZh: 新建IP角色
      db_tables: [ip_characters]

    - path: /admin/ip-approvals
      label: IP 라이센스 승인
      labelZh: IP授权审批
      db_tables: [ip_license_requests]

    - path: /admin/ip-license
      label: IP 라이센스 관리
      labelZh: IP授权管理
      db_tables: [ip_licenses]

    - path: /admin/subscriptions
      label: 구독 서비스 관리
      labelZh: 订阅服务管理
      db_tables: [subscriptions, subscription_plans]

    - path: /admin/trade
      label: 거래 관리
      labelZh: 交易管理
      db_tables: [orders, order_items]

    - path: /admin/payments
      label: 결제 관리
      labelZh: 支付管理
      db_tables: [payments]

    - path: /admin/research
      label: 시장조사 관리
      labelZh: 市场调研管理
      db_tables: [research_requests]

    - path: /admin/samples
      label: 샘플 요청 관리
      labelZh: 样品请求管理
      db_tables: [sample_requests]

    - path: /admin/notifications
      label: 알림 관리
      labelZh: 通知管理
      db_tables: [notifications]

    - path: /admin/members/sellers
      label: 셀러 회원
      labelZh: 卖家会员
      db_tables: [profiles]

    - path: /admin/members/factories
      label: 공장 회원
      labelZh: 工厂会员
      db_tables: [profiles, factories]

    - path: /admin/members/staff
      label: 직원 관리
      labelZh: 员工管理
      db_tables: [profiles]

    - path: /admin/md-performance
      label: MD 성과 관리
      labelZh: MD绩效管理
      db_tables: [profiles, orders]

    - path: /admin/health
      label: 시스템 상태
      labelZh: 系统状态
      db_tables: []

